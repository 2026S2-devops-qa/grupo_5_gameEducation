spring.application.name=ai-service
server.port=8082

# LLM (secao 5.6): tudo vem do .env. O OPENAI_BASE_URL e normalizado pelo
# OpenAiBaseUrlEnvironmentPostProcessor (acrescenta /v1 quando falta).
# Sem chave o servico sobe mesmo assim e as rotas de IA respondem 503.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.chat.temperature=0.2
# Falha rapido (vira 503) em vez de ficar minutos tentando de novo quando o provedor esta sobrecarregado
spring.ai.openai.chat.max-retries=1
spring.ai.openai.chat.timeout=30s
spring.ai.openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
# Embeddings pelo adaptador OpenAiCompativelEmbeddingModel (aceita a resposta do Gemini):
# desliga o OpenAiEmbeddingModel automatico do Spring AI
spring.ai.model.embedding=none

# RAG: arquivo do SimpleVectorStore (no docker: /data/vectorstore.json, num volume)
ia.rag.arquivo-vectorstore=${VECTORSTORE_PATH:./data/vectorstore.json}
# Trechos abaixo dessa similaridade sao descartados (pergunta fora do assunto -> "nao encontrei").
# Depende do modelo de embedding: medido com gemini-embedding-001, perguntas do assunto ~0.70 e
# fora do assunto ~0.52, entao 0.6. Com text-embedding-3-small da OpenAI os valores sao menores
# (use algo como 0.3 no .env: RAG_SIMILARIDADE_MINIMA=0.3).
ia.rag.similaridade-minima=${RAG_SIMILARIDADE_MINIMA:0.6}

# H2 em memoria (as acoes dos agentes entram no RF04)
spring.datasource.url=jdbc:h2:mem:aiservice
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html

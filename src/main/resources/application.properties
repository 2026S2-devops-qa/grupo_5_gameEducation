spring.application.name=grupo_5_gameEducation

# Core na 8081: a 8080 e do API Gateway (unica porta de API exposta, RNF03).
# Vale para o perfil padrao e para o docker, assim gateway e Core rodam juntos fora do docker.
server.port=8081

# Perfil padrao: banco H2 em memoria (uso local e testes)
spring.datasource.url=jdbc:h2:mem:gameeducation;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Console web do H2 em http://localhost:8081/h2-console (so rodando local, fora do docker)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI: pelo gateway em http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator: so o health, usado pelo healthcheck do docker compose
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
